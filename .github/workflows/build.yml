name: Build & Package OmniThread Ultimate

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build OmniThreadUltimate.dll
        run: dotnet build Source/OmniThreadUltimate/OmniThreadUltimate.csproj -c Release

      - name: Package cross-platform Release ZIP
        run: |
          mkdir -p dist/OmniThreadUltimate/About dist/OmniThreadUltimate/Assemblies
          cp About/* dist/OmniThreadUltimate/About/
          cp Assemblies/OmniThreadUltimate.dll dist/OmniThreadUltimate/Assemblies/
          cp LoadFolders.xml LICENSE README.md dist/OmniThreadUltimate/
          cd dist && zip -r ../OmniThreadUltimate-v1.6.0.0.zip OmniThreadUltimate/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniThreadUltimate-v1.6.0.0
          path: OmniThreadUltimate-v1.6.0.0.zip
